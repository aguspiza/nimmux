path = "../src"
# Shared nimcache: both the daemon pre-build step and test compilation point
# to the same directory so asyncdispatch and other heavy modules are compiled
# once (by the daemon build) and reused here instead of recompiling under GCC.
-d:release
--nimcache:"../testcache"
@if gcc and windows:
  gcc.options.linker = "-lwinpthread"
@end
